4788" stroke-width="1.5" stroke-dasharray="2 4"/><text x="55" y="55" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">VECTORS</text></g></g><!-- Positional Encoding --><g transform="translate(200, 160)"><rect x="0" y="0" width="120" height="40" rx="8" stroke="#fa500f" stroke-width="1.5" fill="none"/><text x="60" y="25" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">POS ENC</text><g transform="translate(0, 60)"><path d="M0 20 Q10 0 20 20 T40 20 T60 20 T80 20 T100 20" stroke="#fa500f" stroke-width="1.5" fill="none"/><text x="55" y="55" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">SIN/COS</text></g></g><!-- Input + Pos Enc --><g transform="translate(360, 160)"><rect x="0" y="0" width="120" height="40" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/><text x="60" y="25" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">INPUT+POS</text><g transform="translate(0, 60)"><rect x="0" y="0" width="20" height="20" fill="#2e4788"/><rect x="30" y="0" width="20" height="20" fill="#2e4788"/><rect x="60" y="0" width="20" height="20" fill="#2e4788"/><rect x="90" y="0" width="20" height="20" fill="#2e4788"/><path d="M10 20 L100 20" stroke="#2e4788" stroke-width="1.5" stroke-dasharray="2 4"/><text x="55" y="55" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">VECTORS</text></g></g><!-- Encoder Stack --><g transform="translate(40, 280)"><rect x="0" y="0" width="240" height="60" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/><text x="120" y="35" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">ENCODER (N=6)</text></g><!-- Encoder Layer --><g transform="translate(40, 360)"><rect x="0" y="0" width="240" height="120" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/><text x="120" y="25" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">ENCODER LAYER</text><!-- Multi-Head Attention --><g transform="translate(20, 40)"><rect x="0" y="0" width="100" height="40" rx="8" stroke="#eb4fa2" stroke-width="1.5" fill="none"/><text x="50" y="25" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">MULTI-HEAD</text><text x="50" y="40" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">ATTENTION</text></g><!-- Feed Forward --><g transform="translate(140, 40)"><rect x="0" y="0" width="80" height="40" rx="8" stroke="#5aa8cc" stroke-width="1.5" fill="none"/><text x="40" y="25" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">FFN</text></g><!-- Residual + Norm --><g transform="translate(20, 100)"><rect x="0" y="0" width="200" height="10" rx="2" stroke="#2e4788" stroke-width="1.5" fill="none"/><text x="100" y="25" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">RESIDUAL + NORM</text></g></g><!-- Decoder Stack --><g transform="translate(400, 280)"><rect x="0" y="0" width="240" height="60" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/><text x="120" y="35" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">DECODER (N=6)</text></g><!-- Decoder Layer --><g transform="translate(400, 360)"><rect x="0" y="0" width="240" height="180" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/><text x="120" y="25" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">DECODER LAYER</text><!-- Masked Multi-Head Attention --><g transform="translate(20, 40)"><rect x="0" y="0" width="100" height="40" rx="8" stroke="#eb4fa2" stroke-width="1.5" fill="none"/><text x="50" y="20" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">MASKED</text><text x="50" 