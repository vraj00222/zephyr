late(0, 60)"><rect x="0" y="0" width="20" height="20" rx="2" stroke="#2e4788" stroke-width="1.5" fill="none"/><text x="10" y="35" font-family="monospace" font-size="8" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">T1</text><rect x="30" y="0" width="20" height="20" rx="2" stroke="#2e4788" stroke-width="1.5" fill="none"/><text x="40" y="35" font-family="monospace" font-size="8" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">T2</text><rect x="60" y="0" width="20" height="20" rx="2" stroke="#2e4788" stroke-width="1.5" fill="none"/><text x="70" y="35" font-family="monospace" font-size="8" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">T3</text><path d="M10 20 L100 20" stroke="#2e4788" stroke-width="1.5" stroke-dasharray="2 4"/><text x="55" y="55" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">TOKENS</text></g></g><!-- Arrows --><path d="M100 200 L100 280" stroke="#2e4788" stroke-width="1.5" fill="none"/><polygon points="95,275 100,285 105,275" fill="#2e4788"/><path d="M220 420 L360 420" stroke="#2e4788" stroke-width="1.5" fill="none"/><polygon points="355,415 365,420 355,425" fill="#2e4788"/><path d="M520 560 L520 620" stroke="#2e4788" stroke-width="1.5" fill="none"/><polygon points="515,615 520,625 525,615" fill="#2e4788"/><path d="M520 680 L520 760" stroke="#2e4788" stroke-width="1.5" fill="none"/><polygon points="515,755 520,765 525,755" fill="#2e4788"/></svg>