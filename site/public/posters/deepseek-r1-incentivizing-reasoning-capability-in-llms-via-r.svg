  <text x="380" y="165" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">GROUP RELATIVE POLICY</text>
  <text x="380" y="185" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">OPTIMIZATION (GRPO)</text>
  <text x="380" y="205" font-family="monospace" font-size="9" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">(KL DIVERGENCE + CLIPPING)</text>

