  <text x="120" y="290" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">SAMPLE 16 OUTPUTS</text>

  <rect x="220" y="260" width="160" height="50" rx="8" stroke="#eb4fa2" stroke-width="1.5" fill="none"/>
  <text x="300" y="280" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">TEMPERATURE=1</text>
  <text x="300" y="295" font-family="monospace" font-size="9" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">(EXPLORATION)</text>

  <rect x="400" y="260" width="160" height="50" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/>
  <text x="480" y="280" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">MAX LENGTH</text>
