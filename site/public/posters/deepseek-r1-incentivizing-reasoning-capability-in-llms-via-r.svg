  <text x="140" y="765" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">DEEPSEEK-R1-DEV2</text>

  <rect x="280" y="740" width="200" height="60" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/>
  <text x="380" y="765" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">REINFORCEMENT LEARNING</text>

  <rect x="520" y="740" width="200" height="60" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/>
  <text x="620" y="765" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">LANGUAGE CONSISTENCY</text>

