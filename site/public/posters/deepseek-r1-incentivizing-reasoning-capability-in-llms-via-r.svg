<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000" fill="#ffffff">
  <!-- Inputs -->
  <rect x="40" y="40" width="200" height="60" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/>
  <text x="140" y="75" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">DEEPSEEK-V3-BASE</text>
  
  <rect x="280" y="40" width="200" height="60" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/>
  <text x="380" y="75" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">QUESTIONS (BATCH)</text>
  
  <rect x="520" y="40" width="200" height="60" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/>
  <text x="620" y="75" font-family="monospace" font-size="11" letter-spacing="1" text-anchor="middle" fill="#4a4a5e">RULE-BASED REWARDS</text>

  <!-- GRPO Core -->
