<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000" fill="#ffffff">
<!-- Input -->
<rect x="200" y="40" width="360" height="40" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/>
<text x="380" y="65" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="1" fill="#4a4a5e">INPUT IMAGE</text>

<!-- Conv1 -->
<rect x="200" y="100" width="360" height="40" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/>
<text x="380" y="125" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="1" fill="#4a4a5e">CONV1 (7X7, 64, STRIDE 2)</text>
<path d="M380 80 L380 100" stroke="#2e4788" stroke-width="1.5"/>

<!-- Pool1 -->
<rect x="200" y="160" width="360" height="40" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/>
<text x="380" y="185" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="1" fill="#4a4a5e">MAX POOL (3X3, STRIDE 2)</text>
<path d="M380 140 L380 160" stroke="#2e4788" stroke-width="1.5"/>

<!-- Residual Blocks Group 1 -->
<rect x="200" y="220" width="360" height="60" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/>
<text x="380" y="245" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="1" fill="#4a4a5e">RESIDUAL BLOCKS (X3)</text>
<text x="380" y="265" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="1" fill="#4a4a5e">[CONV (3X3, 64), CONV (3X3, 64)]</text>
<path d="M380 200 L380 220" stroke="#2e4788" stroke-width="1.5"/>

<!-- Key Idea: Residual Block -->
<rect x="120" y="300" width="520" height="120" rx="8" stroke="#fa500f" stroke-width="2" fill="none"/>
<rect x="140" y="320" width="160" height="40" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/>
<text x="220" y="345" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="1" fill="#4a4a5e">CONV LAYERS</text>
<rect x="460" y="320" width="160" height="40" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/>
<text x="540" y="345" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="1" fill="#4a4a5e">SHORTCUT</text>
<path d="M300 340 L460 340" stroke="#2e4788" stroke-width="1.5"/>
<path d="M300 360 L460 360" stroke="#2e4788" stroke-width="1.5"/>
<path d="M460 340 L460 380" stroke="#2e4788" stroke-width="1.5"/>
<path d="M300 360 L300 400" stroke="#2e4788" stroke-width="1.5"/>
<path d="M300 400 L460 380" stroke="#2e4788" stroke-width="1.5"/>
<polygon points="455,380 460,380 457.5,375" fill="#2e4788"/>
<text x="380" y="445" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="1" fill="#4a4a5e">RESIDUAL BLOCK: F(X) + X</text>
<path d="M380 280 L380 300" stroke="#fa500f" stroke-width="2"/>

<!-- Residual Blocks Group 2 -->
<rect x="200" y="480" width="360" height="60" rx="8" stroke="#eb4fa2" stroke-width="1.5" fill="none"/>
<text x="380" y="505" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="1" fill="#4a4a5e">RESIDUAL BLOCKS (X4)</text>
<text x="380" y="525" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="1" fill="#4a4a5e">[CONV (3X3, 128), CONV (3X3, 128)]</text>
<path d="M380 460 L380 480" stroke="#2e4788" stroke-width="1.5"/>

<!-- Residual Blocks Group 3 -->
<rect x="200" y="560" width="360" height="60" rx="8" stroke="#5aa8cc" stroke-width="1.5" fill="none"/>
<text x="380" y="585" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="1" fill="#4a4a5e">RESIDUAL BLOCKS (X6)</text>
<text x="380" y="605" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="1" fill="#4a4a5e">[CONV (3X3, 256), CONV (3X3, 256)]</text>
<path d="M380 540 L380 560" stroke="#2e4788" stroke-width="1.5"/>

<!-- Residual Blocks Group 4 -->
<rect x="200" y="640" width="360" height="60" rx="8" stroke="#f2b03d" stroke-width="1.5" fill="none"/>
<text x="380" y="665" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="1" fill="#4a4a5e">RESIDUAL BLOCKS (X3)</text>
<text x="380" y="685" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="1" fill="#4a4a5e">[CONV (3X3, 512), CONV (3X3, 512)]</text>
<path d="M380 620 L380 640" stroke="#2e4788" stroke-width="1.5"/>

<!-- Global Pool -->
<rect x="200" y="720" width="360" height="40" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/>
<text x="380" y="745" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="1" fill="#4a4a5e">GLOBAL AVERAGE POOL</text>
<path d="M380 700 L380 720" stroke="#2e4788" stroke-width="1.5"/>

<!-- FC Layer -->
<rect x="200" y="780" width="360" height="40" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/>
<text x="380" y="805" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="1" fill="#4a4a5e">FULLY CONNECTED (1000)</text>
<path d="M380 760 L380 780" stroke="#2e4788" stroke-width="1.5"/>

<!-- Output -->
<rect x="200" y="860" width="360" height="40" rx="8" stroke="#2e4788" stroke-width="1.5" fill="none"/>
<text x="380" y="885" text-anchor="middle" font-family="monospace" font-size="11" letter-spacing="1" fill="#4a4a5e">SOFTMAX OUTPUT</text>
<path d="M380 840 L380 860" stroke="#2e4788" stroke-width="1.5"/>

<!-- Shortcut Connections (Dotted) -->
<path d="M200 340 L140 340" stroke="#2e4788" stroke-width="1.5" stroke-dasharray="2 4"/>
<path d="M600 340 L680 340 L680 380 L460 380" stroke="#2e4788" stroke-width="1.5" stroke-dasharray="2 4"/>
<text x="690" y="365" text-anchor="start" font-family="monospace" font-size="10" letter-spacing="1" fill="#4a4a5e">IDENTITY</text>
<text x="690" y="385" text-anchor="start" font-family="monospace" font-size="10" letter-spacing="1" fill="#4a4a5e">SHORTCUT</text>

<!-- Labels for Residual Groups -->
<text x="600" y="255" text-anchor="start" font-family="monospace" font-size="10" letter-spacing="1" fill="#4a4a5e">STRIDE 1</text>
<text x="600" y="520" text-anchor="start" font-family="monospace" font-size="10" letter-spacing="1" fill="#4a4a5e">STRIDE 2</text>
<text x="600" y="600" text-anchor="start" font-family="monospace" font-size="10" letter-spacing="1" fill="#4a4a5e">STRIDE 2</text>
<text x="600" y="680" text-anchor="start" font-family="monospace" font-size="10" letter-spacing="1" fill="#4a4a5e">STRIDE 2</text>

<!-- Arrow for Flow -->
<path d="M380 920 L380 940" stroke="#2e4788" stroke-width="1.5"/>
<polygon points="375,940 385,940 380,950" fill="#2e4788"/>
</svg>